<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>Shop Hub | Coming Soon - Vile Tempest Official</title>
    <meta name="robots" content="noindex, follow" />

    <!-- Mobile & Browser Theme Styling -->
    <meta name="theme-color" content="#0b0f17" />

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Stylesheets (Relative path adjusted for pages/Shop/) -->
    <link rel="stylesheet" href="../../assets/css/root.css" />
    <link rel="stylesheet" href="../../assets/css/navigation.css" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/footer.css" />

    <style>
      .development-wrapper {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }
      .development-card {
        background: var(--bg-surface, #0f172a);
        border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
        border-radius: var(--radius-lg, 12px);
        padding: 36px 28px;
        max-width: 540px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .development-icon-box {
        width: 64px;
        height: 64px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-primary, #38bdf8);
        font-size: 28px;
        margin-bottom: 4px;
      }
      .development-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--accent-primary, #38bdf8);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.6px;
        border-radius: var(--radius-full, 9999px);
        text-transform: uppercase;
      }
      .development-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-primary, #f8fafc);
        margin: 0;
        letter-spacing: -0.4px;
      }
      .development-desc {
        font-size: 0.9rem;
        color: var(--text-secondary, #94a3b8);
        line-height: 1.5;
        margin: 0;
      }
      .development-actions {
        display: flex;
        gap: 12px;
        width: 100%;
        margin-top: 8px;
      }
      .btn-home-return {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--accent-primary, #38bdf8);
        color: #0b0f17;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 12px 20px;
        border-radius: var(--radius-md, 8px);
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
      }
      .btn-home-return:hover {
        opacity: 0.9;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Site Header -->
    <header class="site-header">
      <div class="header-container">
        <a href="../../" class="site-name-link">
          <div class="site-brand-badge">
            <img
              src="../../assets/img/favicon.png"
              alt="Logo"
              class="header-brand-logo"
            />
            <div class="site-name">
              <span class="brand-accent">Vile Tempest</span>
              <span class="brand-suffix">Official</span>
            </div>
          </div>
        </a>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <div class="development-wrapper">
        <div class="development-card">
          <div class="development-icon-box">
            <i class="fa-solid fa-person-digging"></i>
          </div>

          <span class="development-status-pill">
            <i class="fa-solid fa-code-branch"></i> Under Development
          </span>

          <h1 class="development-title">Shop Portal Coming Soon</h1>

          <p class="development-desc">
            We are currently building and formatting our dedicated Shop
            showcase, guidelines, and expanded project portfolio. Check back
            shortly!
          </p>

          <div class="development-actions">
            <a href="../../" class="btn-home-return">
              <i class="fa-solid fa-arrow-left"></i>
              <span>Return to Home Portal</span>
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
